spring.application.name=auth-service
# ============================================
# Konfigurasi Server
# ============================================
server.port=8080

# ============================================
# Konfigurasi Database PostgreSQL
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/jastipapps
spring.datasource.username=YOUR_DATABASE_USER
spring.datasource.password=YOUR_DATABASE_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# Konfigurasi JPA / Hibernate
# ============================================
# validate = Hibernate cuma cek skema cocok atau tidak, TIDAK mengubah tabel kamu
# (aman karena tabel sudah dibuat manual lewat SQL script)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# Konfigurasi JWT (dipakai nanti untuk login)
# ============================================
jwt.secret=YOUR_JWT_SECRET
jwt.expiration-ms=86400000

app.upload.dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB